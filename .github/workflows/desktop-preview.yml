name: Solo desktop preview

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Optional intended stable numeric version; prepares an unpublished candidate'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-and-accept:
    name: ${{ matrix.platform }} portable archive + clean runtime acceptance
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
            browsers: /tmp/examify-browser-fixture
          - os: windows-2022
            platform: win32-x64
            browsers: 'C:\ExamifyBrowserFixture'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_BROWSERS_PATH: ${{ matrix.browsers }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: pnpm
      - name: Install exactly locked build dependencies
        run: pnpm install --frozen-lockfile
      - name: Linux launcher security and packaging tests
        if: runner.os == 'Linux'
        run: node --test tests/desktop/launcher.test.mjs tests/desktop/windows-inventory.test.mjs tests/desktop/fixture-http-provider.test.mjs tests/desktop/upgrades.test.mjs tests/desktop/worker-lock.test.mjs tests/desktop/relocated-helpers.test.mjs
      - name: Windows launcher security and packaging tests under a standard user
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./scripts/desktop/acceptance-windows.ps1 -Repository $env:GITHUB_WORKSPACE -Node (Get-Command node.exe).Source -TestsOnly
      - name: Validate requested version and packaging policies
        env:
          RC_VERSION: ${{ inputs.release_version }}
        run: |
          node -e "if(process.env.RC_VERSION && !/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(process.env.RC_VERSION)) process.exit(1)"
          node --test tests/desktop/distribution.test.mjs tests/desktop/licenses.test.mjs tests/desktop/supplemental-licenses.test.mjs tests/desktop/portable-policy.test.mjs tests/desktop/archive-policy.test.mjs
      - name: Build from clean committed source
        run: node scripts/desktop/build.mjs
      - name: Package native runtime from outside the repository (pinned Node verification)
        env:
          RC_VERSION: ${{ inputs.release_version }}
        run: node -e "require('node:child_process').execFileSync(process.execPath,[require('node:path').join(process.env.GITHUB_WORKSPACE,'scripts/desktop/package.mjs'),process.env.RC_VERSION || 'ci-' + process.env.GITHUB_SHA],{cwd:require('node:os').tmpdir(),stdio:'inherit'})"
      - name: Independently inspect the actual archive and required notice bytes
        run: node scripts/desktop/distribution-policy.mjs check build/desktop/${{ matrix.platform }} ${{ matrix.platform }}
      - name: Install acceptance browser on Linux
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install acceptance browser on Windows
        if: runner.os == 'Windows'
        run: pnpm exec playwright install chromium
      - name: Linux download-arrangement acceptance
        if: runner.os == 'Linux'
        run: node tests/desktop/distribution-acceptance.mjs build/desktop/linux-x64
      - name: Linux installer and packaged app acceptance
        if: runner.os == 'Linux'
        run: node tests/desktop/acceptance.mjs build/desktop/linux-x64
      - name: Linux native cross-version upgrade and crash acceptance
        if: runner.os == 'Linux'
        run: node tests/desktop/upgrade-acceptance.mjs build/desktop/linux-x64
      - name: Windows Command Prompt installer and packaged app under a standard user
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./scripts/desktop/acceptance-windows.ps1 -Repository $env:GITHUB_WORKSPACE -Node (Get-Command node.exe).Source -Browsers $env:PLAYWRIGHT_BROWSERS_PATH
      - name: Upload verified preview artifact (does not publish a release)
        uses: actions/upload-artifact@v7
        with:
          name: examify-solo-${{ matrix.platform }}-${{ github.sha }}
          path: build/desktop/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: ${{ inputs.release_version && 90 || 7 }}

  assemble-candidate:
    name: Assemble unpublished matched candidate
    if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
    needs: package-and-accept
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
      - uses: actions/download-artifact@v8
        with:
          name: examify-solo-linux-x64-${{ github.sha }}
          path: build/desktop/linux-x64
      - uses: actions/download-artifact@v8
        with:
          name: examify-solo-win32-x64-${{ github.sha }}
          path: build/desktop/win32-x64
      - name: Assemble exact tested platform assets (never publish or tag)
        run: node scripts/desktop/distribution.mjs assemble build/desktop build/release-candidate
      - uses: actions/upload-artifact@v7
        with:
          name: examify-candidate-${{ inputs.release_version }}-${{ github.sha }}
          path: build/release-candidate/
          if-no-files-found: error
          retention-days: 90
